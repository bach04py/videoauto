[project]
name = "videoauto"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "faster-whisper>=1.1",
    "scenedetect>=0.7",
    "opencv-python>=4.9",
    "numpy>=1.26",
    "librosa>=0.10",
    "soundfile>=0.12",
    "jsonschema>=4.20",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["videoauto*"]

[tool.setuptools.package-data]
videoauto = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
