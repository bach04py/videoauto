[project]
name = "videoauto"
version = "0.1.0"
description = "Raw footage folder in, finished short video out: index (ffmpeg/OpenCV + Claude captions), plan (one model call), build (OpenChatCut occ CLI)."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "faster-whisper>=1.1",
    "scenedetect>=0.7",
    "opencv-python>=4.9",
    "numpy>=1.26",
    "jsonschema>=4.20",
    "httpx>=0.27",
    "pyyaml>=6",
]

[project.optional-dependencies]
# Music analysis (BPM, beats). numpy is capped because Windows Smart App Control blocks
# numpy 2.5.x's numpy/random/_sfc64.pyd (imported by librosa via scipy/numba);
# numpy 2.2.6 loads. Video indexing does not need librosa or the cap.
music = ["librosa>=0.10", "numpy>=2.0,<2.3"]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["videoauto*"]

[tool.setuptools.package-data]
videoauto = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
